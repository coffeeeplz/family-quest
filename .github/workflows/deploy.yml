# main 가지에 코드가 올라오면 자동으로 검사하고, 빌드해서 GitHub Pages 주소에 배포하고, Firestore 규칙도 함께 게시한다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Firestore 보안 규칙(firestore.rules)을 Firebase 에 게시한다.
  # 저장소 Secrets 의 FIREBASE_SERVICE_ACCOUNT(배포 전용 서비스 계정 키)가 없으면 건너뛴다.
  rules:
    name: 규칙 게시
    needs: build
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 키가 없으면 알림
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 가 없어 규칙 게시를 건너뜁니다. firestore.rules 를 콘솔에 직접 게시해 주세요."
      - name: 규칙 게시
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15 deploy --only firestore:rules --project family-quest-22c44 --non-interactive
      - name: 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
